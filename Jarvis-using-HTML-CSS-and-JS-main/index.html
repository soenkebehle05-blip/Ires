<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.R.E.S. System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Status-Leiste -->
    <header id="top-bar">
        <div class="brand">I.R.E.S.</div>
        <div class="system-status">
            <span id="status-dot" class="status-dot"></span>
            <span id="status-label">ONLINE</span>
        </div>
        <div class="controls">
            <button id="theme-toggle" title="Klick: Einstellungen | Doppelklick: Farbe wechseln">◐</button>
            <div id="clock">00:00:00</div>
        </div>
    </header>

    <!-- Einstellungsmenü (Standardmäßig verdeckt) -->
    <div id="settings-menu" class="settings-card hidden">
        <div class="settings-header">
            <h3>EINSTELLUNGEN</h3>
            <button id="close-menu-btn" type="button">✕ Menü schließen</button>
        </div>
        <div class="settings-body">
            <label for="ical-url-input">Google Kalender iCal-Link:</label>
            <input type="text" id="ical-url-input" placeholder="https://calendar.google.com/calendar/ical/.../basic.ics">
            <button id="save-ical-btn" type="button">Link speichern</button>
            <span id="ical-status-msg"></span>
        </div>
    </div>

    <!-- Hauptbereich -->
    <div id="app-viewport">
        <main id="main-container">
            <!-- Reaktor & Waveform Visuelle Anzeige -->
            <div id="visualizer-container">
                <div id="reactor"></div>
                <div id="waveform">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>

            <!-- Chat / Ausgabebereich -->
            <div id="jarvis-output" class="output-container">
                <div id="output-area"></div>
            </div>

            <!-- Eingabezeile -->
            <div id="input-container">
                <input type="text" id="user-input" placeholder="Befehl eingeben oder 'Hilfe' schreiben..." autocomplete="off">
                <button id="mic-btn" title="Spracheingabe">🎤</button>
                <button id="send-btn">Senden</button>
            </div>
        </main>

        <!-- Sidebar / System-Protokoll -->
        <aside id="sidebar">
            <div class="panel">
                <h4>SYSTEM READOUT</h4>
                <ul>
                    <li>Datum: <span id="readout-date">--.--.----</span></li>
                    <li>Uptime: <span id="readout-uptime">00:00:00</span></li>
                    <li>Akku: <span id="readout-battery">--%</span></li>
                    <li>Sprache: <span id="readout-voice">AN</span></li>
                    <li>Mikrofon: <span id="readout-mic">INAKTIV</span></li>
                </ul>
            </div>

            <div class="panel">
                <h4>MEMOS <span id="notes-count">(0)</span></h4>
                <ul id="notes-list"></ul>
            </div>

            <div class="panel">
                <h4>AKTIVITÄT</h4>
                <ul id="activity-log"></ul>
            </div>
        </aside>
    </div>

    <!-- Login / Auth Modal -->
    <div id="auth-modal" class="modal-backdrop hidden">
        <div class="modal-card">
            <h2 id="auth-title">SYSTEM-AUTHENTIFIZIERUNG</h2>
            <div id="email-field" style="display: none;">
                <label>E-Mail</label>
                <input type="email" id="auth-email">
            </div>
            <div>
                <label>Benutzername</label>
                <input type="text" id="auth-username">
            </div>
            <div>
                <label>Passwort</label>
                <input type="password" id="auth-password">
            </div>
            <div class="remember-box">
                <input type="checkbox" id="auth-remember">
                <label for="auth-remember">30 Tage angemeldet bleiben</label>
            </div>
            <div id="auth-error" class="error-msg"></div>
            <button id="auth-submit-btn">ANMELDEN</button>
            <button id="auth-toggle-btn" class="btn-link">Neues Konto erstellen</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
